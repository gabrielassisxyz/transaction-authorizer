groups:
  - name: rollout-gate
    rules:
      # The two conditions docs/deploy.md reverts the canary on, with no human decision in
      # the loop. They live here, versioned, because a gate that exists only in prose
      # reverts nothing.
      - alert: LatencyP99AboveTarget
        expr: authorization:latency_p99:5m > 0.15
        for: 5m
        labels:
          severity: critical
          action: rollback
        annotations:
          summary: "authorization p99 above target"
          description: >
            p99 at {{ $value | humanizeDuration }} against a 150ms target, sustained over
            the step window. Latency leg of the rollout gate.

      - alert: AvailabilityBelowTarget
        expr: authorization:availability:5m < 0.999
        for: 5m
        labels:
          severity: critical
          action: rollback
        annotations:
          summary: "authorization availability below target"
          description: >
            Non-5xx fraction at {{ $value | humanizePercentage }} against a 99.9% target.
            A refusal for insufficient funds answers 200 and does not count here.

  - name: capacity
    rules:
      # A sustained pool queue is the signal that the instance is at its concurrency limit,
      # and the measurement in docs/load/results.md shows the host still has CPU to spare
      # when it happens: the wait is in the pool, so no processor metric sees this limit.
      - alert: SustainedPoolQueue
        expr: hikaricp_connections_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "requests waiting for a connection for 10 minutes"
          description: >
            {{ $value }} requests queued on the pool. More connections deliver more
            throughput and a shorter tail, so raising the pool or the fleet helps, as long
            as the total against the database fits max_connections. Check the connection
            budget before raising either.

  - name: dependencies
    rules:
      - alert: AuthorizationCircuitOpen
        expr: authorizations_circuit_open > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "authorization circuit open or probing recovery"
          description: >
            The store is unreachable and authorization answers 503 with Retry-After,
            persisting no refusal (ADR-008).

      - alert: AccountQueueUnreachable
        expr: sqs_connectivity == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "account-creation queue unreachable"
          description: >
            The HTTP path is healthy: readiness deliberately does not follow the queue, so
            the authorizer stays in rotation while consumption waits.

      # The message that gets lost is the valid one, not the poison one. A body that does
      # not parse raises the poison counter and the alert below catches it; a legitimate
      # account whose database was down raises `failed`, returns through the queue, and
      # slips into the dead-letter queue once the receive budget runs out, with nothing
      # else firing.
      - alert: TransientConsumerFailures
        expr: increase(sqs_messages_total{outcome="failed"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "account-creation messages failing for 10 minutes"
          description: >
            {{ $value }} transient failures in the window. The message returns through the
            queue, but the budget before the dead-letter queue is around two minutes of
            downtime, so a longer outage sends a valid account there.

      - alert: PoisonMessagesGrowing
        expr: increase(sqs_messages_total{outcome="poison"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "message discarded to the dead-letter queue"
          description: >
            A body that does not parse spent the retry budget. The dead-letter queue is a
            stopping point for a human decision, not an automatic retry path.

# What these rules do NOT cover, and why.
#
# Queue depth, age of the oldest message and dead-letter queue depth are the three series
# that would say whether consumption is keeping up with production. None of them comes from
# the application: they are SQS's own metrics, published to CloudWatch, and would arrive
# here through an exporter. Until one exists, the available signal is indirect, the failure
# counter above, and a growing backlog with healthy consumption would go unnoticed.
#
# It is recorded as a gap rather than silenced, because for the account-creation path this
# is the difference between knowing and not knowing that a legitimate account was lost.
