groups:
  - name: gate-de-rollout
    rules:
      # As duas condicoes que docs/deploy.md manda reverter o canario sem esperar decisao
      # humana. Ficam aqui, versionadas, porque um gate que so existe em prosa nao reverte
      # nada.
      - alert: LatenciaP99AcimaDoAlvo
        expr: autorizacao:latencia_p99:5m > 0.15
        for: 5m
        labels:
          severity: critical
          acao: rollback
        annotations:
          summary: "p99 da autorizacao acima do alvo"
          description: >
            p99 em {{ $value | humanizeDuration }} contra alvo de 150ms, sustentado pela
            janela do degrau. Perna de latencia do gate de rollout.

      - alert: DisponibilidadeAbaixoDoAlvo
        expr: autorizacao:disponibilidade:5m < 0.999
        for: 5m
        labels:
          severity: critical
          acao: rollback
        annotations:
          summary: "disponibilidade da autorizacao abaixo do alvo"
          description: >
            Fracao de nao-5xx em {{ $value | humanizePercentage }} contra alvo de 99,9%.
            Recusa por saldo responde 200 e nao entra nesta conta.

  - name: capacidade
    rules:
      # Fila no pool sustentada e o sinal de que a instancia esta no seu limite de
      # concorrencia, e a medicao em docs/load/results.md mostra que o host ainda tem CPU
      # sobrando quando isso acontece: a espera esta no pool, entao nenhuma metrica de
      # processador ve este limite.
      - alert: FilaNoPoolSustentada
        expr: hikaricp_connections_pending > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "requisicoes esperando conexao ha 10 minutos"
          description: >
            {{ $value }} requisicoes na fila do pool. Conexoes a mais entregam mais vazao e
            cauda menor, entao aumentar pool ou frota ajuda, desde que o total contra o banco
            caiba no max_connections. Confira o orcamento de conexao antes de subir qualquer
            um dos dois.

  - name: dependencias
    rules:
      - alert: CircuitoDaAutorizacaoAberto
        expr: authorizations_circuit_open > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "circuito da autorizacao aberto ou sondando recuperacao"
          description: >
            O armazenamento esta inalcancavel e a autorizacao responde 503 com Retry-After,
            sem persistir recusa (ADR-008).

      - alert: FilaSqsInalcancavel
        expr: sqs_connectivity == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "fila de criacao de contas inalcancavel"
          description: >
            A via HTTP segue sa: a readiness nao acompanha a fila de proposito, entao o
            autorizador continua em rotacao enquanto o consumo espera.

      # A mensagem que se perde nao e a veneno, e a valida. Corpo que nao parseia sobe o
      # contador de poison e o alerta abaixo pega; uma conta legitima cujo banco estava fora
      # do ar sobe `failed`, volta pela fila, e some para a dead-letter queue quando o
      # orcamento de recebimento acaba, sem que nada mais dispare. Este contador ja existia
      # no codigo e nao era lido por regra nenhuma.
      - alert: FalhasTransitoriasNoConsumo
        expr: increase(sqs_messages_total{outcome="failed"}[10m]) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "mensagens de criacao de conta falhando ha 10 minutos"
          description: >
            {{ $value }} falhas transitorias na janela. A mensagem volta pela fila, mas o
            orcamento antes da dead-letter queue e de cerca de dois minutos de
            indisponibilidade, entao uma queda mais longa manda conta valida para la.

      - alert: MensagensVenenoCrescendo
        expr: increase(sqs_messages_total{outcome="poison"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "mensagem descartada para a dead-letter queue"
          description: >
            Corpo que nao parseia chegou ao orcamento de retentativa. A dead-letter queue e
            ponto de parada para decisao humana, nao caminho de retentativa automatica.

# O que estas regras NAO cobrem, e por que.
#
# Profundidade da fila, idade da mensagem mais antiga e profundidade da dead-letter queue
# sao as tres series que diriam se o consumo esta acompanhando a producao. Nenhuma delas
# vem da aplicacao: sao metricas do proprio SQS, publicadas no CloudWatch, e chegariam aqui
# por um exporter. Enquanto ele nao existir, o sinal disponivel e indireto, o contador de
# falhas acima, e um backlog crescente com consumo saudavel passaria despercebido.
#
# Fica registrado como lacuna em vez de silenciado, porque para a via de criacao de contas
# essa e a diferenca entre saber e nao saber que uma conta legitima se perdeu.
