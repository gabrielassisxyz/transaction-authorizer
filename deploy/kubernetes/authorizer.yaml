# Kubernetes is not the deployment target of this service: ADR-009 picks ECS Fargate and
# argues why. This manifest exists to make that ADR's central claim verifiable, the claim
# that the choice is reversible because nothing in the code knows the orchestrator. Every
# piece below is the direct translation of something that already exists, and the most
# important absence here is deliberate: there is no HorizontalPodAutoscaler.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authorizer-config
  labels:
    app: authorizer
data:
  # 12-factor: the same image runs in any environment and only the configuration changes.
  DB_URL: jdbc:postgresql://postgres:5432/transaction_authorizer
  # The per-replica pool is the unit of the fleet arithmetic in docs/scale.md. Changing this
  # number changes how many replicas the database supports, so it is not a local tweak.
  DB_POOL_SIZE: "20"
  # The floor the breaker needs in order to learn from calls that terminate (ADR-008).
  DB_CONNECTION_TIMEOUT_MS: "3000"
  AWS_REGION: sa-east-1
  SQS_QUEUE_NAME: conta-bancaria-criada
  SQS_POLLERS: "2"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorizer
  labels:
    app: authorizer
spec:
  # Two replicas for availability, and so the stepped rollout has two versions serving at
  # once. More replicas also buy throughput, but the ceiling is the database connection
  # budget: each replica takes its whole pool into max_connections (docs/scale.md).
  replicas: 2
  selector:
    matchLabels:
      app: authorizer
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never more than three replicas at once during a rollout, which is at most 60
      # connections against the database in the swap window. A deploy is exactly when peak
      # connection usage happens with nobody expecting it, so the surge stays bounded.
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: authorizer
    spec:
      # One replica per zone, the same shape as the topology in docs/deploy.md.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: authorizer
      containers:
        - name: authorizer
          image: transaction-authorizer:scale-verify
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: authorizer-config
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authorizer-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authorizer-secrets
                  key: db-password
          resources:
            requests:
              # Concurrency is bounded by the connection pool, not by the CPU (ADR-009), so
              # the CPU is sized to serve the pool rather than to be the axis of scale.
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 768Mi
          # The two probes are the one-to-one translation of the health groups that already
          # exist in application.yaml, and they are separate for the same reason here and on
          # ECS: liveness carries no dependency, so a database outage never restarts the
          # process and turns a dependency failure into a cascade of restarts.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # Readiness follows the database: no database, no authorization, pull the replica.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
          # Startup runs the Flyway migration before serving, so the startup gate is separate
          # from readiness and the migration is not counted as a failure.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          securityContext:
            runAsNonRoot: true
            # The UID has to be numeric. The Dockerfile declares `USER app`, and a name does
            # not work: the kubelet resolves the user before a container exists to resolve the
            # name in, so with runAsNonRoot on it rejects the image, unable to prove the user
            # is not root. 999 is the uid useradd --system assigns.
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # With a read-only root, the embedded Tomcat still needs a temporary directory to
            # write into. Without this the process does not start.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      # Graceful shutdown waits for in-flight SQS messages to finish, and this timeout has to
      # outlast the 20s long poll so a received, not yet committed message is not abandoned
      # (docs/failure-modes.md).
      terminationGracePeriodSeconds: 45
---
apiVersion: v1
kind: Service
metadata:
  name: authorizer
  labels:
    app: authorizer
spec:
  type: ClusterIP
  selector:
    app: authorizer
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: authorizer
spec:
  # One replica always serving during node maintenance. With two replicas this caps eviction
  # at one at a time, which is the wanted behaviour: the other one carries the traffic.
  minAvailable: 1
  selector:
    matchLabels:
      app: authorizer
# A deliberate absence: no HorizontalPodAutoscaler.
#
# Every platform defaults to scaling on CPU, and here that metric is blind to the limit that
# matters. The measurement in docs/load/results.md records the pool at 98% occupancy with 134
# requests queued while the host kept 48% of its CPU idle: the wait is in the pool, not in the
# processor, so a CPU-driven HPA does not react when the service is already at its limit.
#
# The ceiling is one of budget rather than throughput: each replica takes its whole pool into
# the database's max_connections, which is finite and shared. Until there is a pooler between
# the replicas and the database, the correct policy is a declared fixed ceiling. With a pooler,
# the axis of scale becomes pool saturation, and an HPA over that metric starts to make sense.
