openapi: 3.1.0
info:
  title: Transaction Authorizer
  version: 0.1.0
  description: >
    Autoriza transações de crédito e débito contra o saldo de uma conta, com a invariante
    de saldo nunca negativo e idempotência por identificador de transação. O esquema de
    requisição abaixo é uma suposição derivada do corpo de resposta exigido, não de um
    contrato externo publicado: o valor trafega como decimal com moeda, e a resposta o
    devolve no mesmo formato. Detalhes de decisão em docs/adr (002, 004, 006).
servers:
  - url: http://localhost:8080
paths:
  /transactions/{transactionId}:
    post:
      summary: Autoriza uma transação de crédito ou débito
      description: >
        Aprovação e recusa retornam ambas 200: a recusa é um resultado de domínio, não um
        erro de transporte (ADR-006). O mesmo transactionId reenviado devolve a decisão
        original sem mover o saldo de novo (ADR-004).
      operationId: authorizeTransaction
      parameters:
        - name: transactionId
          in: path
          required: true
          description: Identificador da transação, gerado pelo cliente. Idempotente.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorizeTransactionRequest'
            example:
              account_id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
              type: CREDIT
              amount:
                value: 100.00
                currency: BRL
      responses:
        '200':
          description: >
            Decisão tomada e registrada. transaction.status é SUCCEEDED quando aprovada e
            FAILED quando recusada por fundo insuficiente, conta desabilitada ou overflow.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizeTransactionResponse'
              example:
                transaction:
                  id: 11111111-1111-1111-1111-111111111111
                  type: CREDIT
                  amount:
                    value: 100.00
                    currency: BRL
                  status: SUCCEEDED
                  timestamp: '2026-01-15T10:30:00Z'
                account:
                  id: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                  balance:
                    value: 100.00
                    currency: BRL
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '404':
          $ref: '#/components/responses/AccountNotFound'
        '422':
          $ref: '#/components/responses/UnprocessableRequest'
        '503':
          $ref: '#/components/responses/StorageUnreachable'
        '405':
          $ref: '#/components/responses/MethodNotSupported'
        '415':
          $ref: '#/components/responses/MediaTypeNotSupported'
components:
  # Cada desfecho de erro é declarado uma vez e referenciado pela operação: o corpo
  # application/problem+json era repetido em quatro respostas, e a repetição é o que faz
  # uma delas divergir das outras quando o formato de erro mudar.
  responses:
    MalformedRequest:
      description: >
        Requisição malformada: JSON inválido, campo ausente, transactionId que não é
        UUID, valor com mais de duas casas decimais ou valor não positivo.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    AccountNotFound:
      description: A conta informada não existe.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableRequest:
      description: >
        Requisição bem formada mas não processável: moeda diferente de BRL ou valor
        fora da faixa representável do livro-razão.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    StorageUnreachable:
      description: >
        O serviço não conseguiu alcançar o armazenamento e por isso não decidiu nada
        sobre esta transação. Não é uma recusa: nenhuma transação foi persistida e o
        saldo não mudou, então reenviar o mesmo transactionId depois da janela é
        seguro. O cabeçalho Retry-After diz quanto esperar.
      headers:
        Retry-After:
          description: Segundos a esperar antes de reenviar.
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotSupported:
      description: >
        Método diferente de POST no mesmo caminho. Cai no tratamento padrão do Spring
        Boot, não no handler RFC 9457 dos demais erros: corpo application/json, não
        application/problem+json.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultError'
    MediaTypeNotSupported:
      description: >
        Content-Type diferente de application/json. Mesmo tratamento padrão do 405,
        pelo mesmo motivo: a requisição nunca chega ao controller.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DefaultError'
  schemas:
    AuthorizeTransactionRequest:
      type: object
      required: [account_id, type, amount]
      properties:
        account_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [CREDIT, DEBIT]
        amount:
          $ref: '#/components/schemas/Money'
    AuthorizeTransactionResponse:
      type: object
      required: [transaction, account]
      properties:
        transaction:
          type: object
          required: [id, type, amount, status, timestamp]
          properties:
            id:
              type: string
              format: uuid
            type:
              type: string
              enum: [CREDIT, DEBIT]
            amount:
              $ref: '#/components/schemas/Money'
            status:
              type: string
              enum: [SUCCEEDED, FAILED]
            timestamp:
              type: string
              format: date-time
        account:
          type: object
          required: [id, balance]
          properties:
            id:
              type: string
              format: uuid
            balance:
              $ref: '#/components/schemas/Money'
    Money:
      type: object
      description: >
        Um único formato de dinheiro, deliberadamente compartilhado pelo valor da
        transação e pelo saldo da conta: os dois são a mesma ideia, um montante com
        moeda, e um nome de campo diferente para cada um faria o cliente escrever dois
        parsers para o mesmo tipo.
      required: [value, currency]
      properties:
        value:
          type: number
          description: >
            Decimal com no máximo duas casas significativas. Nunca negativo, e o valor
            de uma transação é sempre maior que zero; um saldo pode ser zero.
          example: 10.50
        currency:
          type: string
          enum: [BRL]
    Problem:
      type: object
      description: >
        Corpo de erro conforme RFC 9457, produzido pelo handler da aplicação. O membro
        type do RFC não aparece: a aplicação nunca customiza esse campo, e o Spring omite
        o valor padrão about:blank da serialização.
      # O RFC não obriga nenhum membro, mas o handler sempre preenche estes três, e um
      # cliente que trate erro pode contar com eles. instance fica de fora porque depende
      # do caminho que gerou o erro.
      required: [title, status, detail]
      properties:
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
          description: Caminho da requisição que gerou o erro.
    DefaultError:
      type: object
      description: >
        Corpo de erro padrão do Spring Boot para requisições que nunca chegam ao
        controller (método ou Content-Type não suportado).
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        path:
          type: string
