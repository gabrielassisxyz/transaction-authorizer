services:
  postgres:
    image: postgres:17.5
    container_name: postgres
    environment:
      - POSTGRES_DB=transaction_authorizer
      - POSTGRES_USER=authorizer
      - POSTGRES_PASSWORD=authorizer
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U authorizer -d transaction_authorizer" ]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3.7.2
    hostname: localstack
    container_name: localstack
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SERVICES=sqs
      - SKIP_SSL_CERT_DOWNLOAD=1
      - DISABLE_EVENTS=1
    ports:
      - "127.0.0.1:${LOCALSTACK_PORT:-4566}:4566"
      - "127.0.0.1:4510-4559:4510-4559"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4566/_localstack/health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  sqs-configurator:
    image: amazon/aws-cli:2.31.19
    container_name: sqs-configurator
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_DEFAULT_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - QUEUE_NAME=conta-bancaria-criada
      - LOCALSTACK_ENDPOINT=http://localstack:4566
    volumes:
      - ./docker/sqs-configurator.sh:/sqs-configurator.sh:ro
    entrypoint: [ "/bin/sh", "/sqs-configurator.sh" ]

  message-generator:
    image: golang:1.24.3
    container_name: message-generator
    depends_on:
      localstack:
        condition: service_healthy
        restart: true
      # The generator creates the queue if it is missing, and a queue created that way
      # has no redrive policy, so the topology has to exist before the first message.
      sqs-configurator:
        condition: service_completed_successfully
    environment:
      # SQS settings
      - QUEUE_NAME=conta-bancaria-criada
      - LOCALSTACK_ENDPOINT=http://localstack:4566

      # Generator settings
      - TOTAL_ACCOUNTS=100000
      
      # Go settings
      - GOPROXY=https://proxy.golang.org
      - GOSUMDB=sum.golang.org
    volumes:
      - ./docker/message-generator.go:/message-generator.go:ro
    command: >
      /bin/sh -c "
        openssl s_client -showcerts -connect proxy.golang.org:443 </dev/null 2>/dev/null |
          awk '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/ { print \$0 }' > /usr/local/share/ca-certificates/ca_bundle.crt &&
        update-ca-certificates &&
        rm -rf /tmp/go && mkdir -p /tmp/go && cp /message-generator.go /tmp/go/ && cd /tmp/go &&
        go clean -modcache &&
        go mod init message-generator &&
        go mod tidy &&
        go mod download &&
        go run message-generator.go
      "
    working_dir: /home

  # A default service, so `docker compose up` runs the whole system containerized in one
  # command: the artefact that ships is what a first contact meets, not a development loop.
  # That loop is still one command away, `docker compose up -d --scale app=0`, which brings
  # up the dependencies alone for `./gradlew bootRun`. Points at the compose service names,
  # not localhost.
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: transaction-authorizer
    # Só o banco é dependência de execução: a migração roda na partida e a readiness segue
    # o banco, então sem Postgres não há autorização. As outras duas condições existem para
    # semear, não porque a aplicação precise delas: com a fila inalcançável o poller recua
    # com full jitter e a via HTTP segue atendendo, que é o comportamento documentado em
    # docs/failure-modes.md. Esperar o gerador terminar é o que garante conta semeada no
    # primeiro `up`, e sem isso a primeira requisição de quem chega pelo README daria 404.
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      message-generator:
        condition: service_completed_successfully
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/transaction_authorizer
      - DB_USERNAME=authorizer
      - DB_PASSWORD=authorizer
      - SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=sa-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - SQS_QUEUE_NAME=conta-bancaria-criada
      # The two values the load campaign sweeps. They carry the same defaults as the
      # application, restated here because an unlisted variable is not passed into the
      # container at all: without these lines the campaign could not vary the pool it
      # exists to measure.
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - SQS_POLLERS=${SQS_POLLERS:-2}
    ports:
      # Loopback by default, so a development machine does not put the authorizer on its
      # network. The load campaign runs the generator on a separate host and overrides
      # APP_BIND to 0.0.0.0, where the security group is what restricts the reach.
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8080}:8080"
