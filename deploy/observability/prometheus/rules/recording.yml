groups:
  - name: authorization-sli
    interval: 30s
    rules:
      # The two legs of the rollout gate described in docs/deploy.md. They are recording
      # rules because the gate, the alert and a dashboard have to read the exact same
      # expression: three hand-written queries drift apart, and the drift shows up at the
      # worst possible moment, during a rollback.
      - record: authorization:latency_p99:5m
        expr: |
          histogram_quantile(
            0.99,
            sum by (le) (
              rate(http_server_requests_seconds_bucket{uri="/transactions/{transactionId}"}[5m])
            )
          )

      # Availability is the fraction of non-5xx responses. A refusal for insufficient funds
      # answers 200 (ADR-006), so a legitimate business decision never lands here as a failure.
      - record: authorization:availability:5m
        expr: |
          1
          -
          (
            sum(rate(http_server_requests_seconds_count{uri="/transactions/{transactionId}",status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(http_server_requests_seconds_count{uri="/transactions/{transactionId}"}[5m])), 1e-9)
          )

  - name: capacity
    interval: 30s
    rules:
      # Pool saturation per instance. The concurrency ceiling of this service is the
      # connection pool, not the CPU (docs/scale.md), so this is the series that says
      # whether an instance is at its limit, and no processor metric says it.
      - record: instance:pool_saturation:ratio
        expr: |
          hikaricp_connections_active / clamp_min(hikaricp_connections_max, 1)

      # Connections summed over the whole fleet. This is the quantity the database's
      # max_connections caps, and Postgres does not care which instance each connection came
      # from: it is this number, not the task count, that has to fit the budget.
      - record: fleet:total_connections:sum
        expr: sum(hikaricp_connections_max)
